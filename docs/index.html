<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Rain Mode</title>
    <script src="rain.min.js"></script>
    <style type="text/css" media="screen">
      body {
        color: black;
        background-color: black;
        font-size: 3em;
      }
      .rain {
        background-color: black;
        font-family: monospace;
      }
      .raindrop-near {
        color: #7ff;
      }
      .raindrop-far {
        color: #f7f;
      }
      .raindrop-very-far {
        color: #777;
      }
    </style>
  </head>
  <body>
    <div id="window"></div>
    <script type="text/javascript">
      const app = Elm.RainMode.init({
        node: document.getElementById('window'),
        flags: {
          width: 40,
          height: 25
        }
      });
    </script>
  </body>
</html>
